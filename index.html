            --text-dark: #1a1a1a;
            --text-muted: #665c54;
            --border-color: #e8e2d8;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-sm: 0 4px 12px rgba(15, 42, 74, 0.05);
            --shadow-hover: 0 8px 24px rgba(58, 34, 24, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* HERO HEADER */
        header {
            text-align: center;
            padding: 70px 20px 50px;
            background-color: #fcfbfa;
            border-bottom: 1px solid var(--border-color);
        }

        .badge {
            display: inline-block;
            background-color: #eef4fa;
            color: var(--blue-dark);
            border: 1px solid #d0e0f0;
            font-size: 0.85rem;
            font-weight: 700;
            padding: 6px 18px;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 20px;
        }

        .brand-title {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--blue-dark);
            letter-spacing: -1.5px;
            margin-bottom: 12px;
        }

        .hero-text h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--brown-dark);
            margin-bottom: 6px;
        }

        .hero-text p {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 550px;
            margin: 0 auto;
        }

        /* MAIN CONTAINER */
        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .category-section {
            margin-bottom: 60px;
        }

        .category-header-block {
            margin-bottom: 24px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--brown-dark);
        }

        .category-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--brown-dark);
            letter-spacing: -0.5px;
        }

        /* HORIZONTAL GRID LAYOUT */
        .checklists-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
            align-items: start;
        }

        /* ACCORDION CARDS */
        .accordion-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s ease;
        }

        .accordion-item:hover {
            border-color: var(--brown-accent);
            box-shadow: var(--shadow-hover);
        }

        .accordion-btn {
            width: 100%;
            background: none;
            border: none;
            outline: none;
            padding: 20px 24px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--blue-dark);
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .accordion-btn:hover {
            background-color: var(--bg-card-hover);
        }

        .icon-box {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #eef4fa;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--blue-dark);
            transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease;
        }

        .accordion-btn.active .icon-box {
            transform: rotate(180deg);
            background: var(--brown-dark);
            color: #ffffff;
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0, 1, 0, 1);
            padding: 0 24px;
            background-color: #ffffff;
        }

        /* CHECKLIST ITEMS */
        .items-list {
            list-style: none;
            padding: 20px 0 10px;
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 10px;
            border-radius: var(--radius-md);
            font-size: 0.92rem;
            color: var(--text-dark);
            cursor: pointer;
            transition: background 0.15s ease;
        }

        .item:hover {
            background: #f8f6f2;
        }

        .item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--brown-dark);
            cursor: pointer;
        }

        .item input[type="checkbox"]:checked + span {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* DOWNLOAD BUTTON */
        .download-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background-color: var(--brown-dark);
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            cursor: pointer;
            margin: 16px 0 24px 0;
            transition: all 0.2s ease;
        }

        .download-btn:hover {
            background-color: var(--blue-dark);
            transform: translateY(-2px);
        }

        @media print {
            header, .icon-box, .download-btn { display: none !important; }
            body { background: white; color: black; }
            .container { max-width: 100%; margin: 0; padding: 0; }
            .checklists-grid { display: block; }
            .accordion-item { border: 1px solid #ccc; background: white; margin-bottom: 20px; break-inside: avoid; }
            .accordion-content { max-height: none !important; padding: 0 20px; }
        }

        @media (max-width: 768px) {
            .checklists-grid { grid-template-columns: 1fr; }
            .brand-title { font-size: 2.5rem; }
        }
    </style>
</head>

    <!-- ACCORDION SCRIPT -->
    <script>
        const accBtns = document.querySelectorAll('.accordion-btn');

        accBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const isOpen = btn.classList.contains('active');
                
                if (isOpen) {
                    btn.classList.remove('active');
                    btn.nextElementSibling.style.maxHeight = null;
                } else {
                    btn.classList.add('active');
                    const content = btn.nextElementSibling;
                    content.style.maxHeight = content.scrollHeight + "px";
                }
            });
        });
    </script>
