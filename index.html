<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Man Ana | Who Am I - Pro Edition</title>
    <script type='text/javascript' src='https://pl28624341.effectivegatecpm.com/b1/14/50/b11450976f89eab48c7990b01c6d76af.js'></script>
    <style>
        :root { --bg: #7a5c91; --card-bg: #4a345a; --accent: #d4a5ff; --text-p: #ffffff; --text-s: #e0d0eb; --btn: #967bb6; }
        .dark-mode { --bg: #0f0f0f; --card-bg: #1a1a1a; --accent: #00d2ff; --text-p: #ffffff; --text-s: #888888; --btn: #333333; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text-p); transition: 0.5s; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { width: 90%; max-width: 850px; background: var(--card-bg); padding: 35px; border-radius: 25px; box-shadow: 0 15px 45px rgba(0,0,0,0.3); text-align: center; position: relative; }
        .theme-toggle { position: absolute; top: 15px; left: 15px; cursor: pointer; background: var(--accent); color: #2e1a3d; padding: 8px 12px; border-radius: 15px; font-weight: bold; font-size: 0.75rem; }
        h1 { font-size: 2.2rem; color: var(--accent); margin-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 25px; }
        .quiz-card { background: rgba(255,255,255,0.08); padding: 18px; border-radius: 15px; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .quiz-card:hover { background: var(--btn); transform: scale(1.03); }
        .option-btn { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.15); padding: 15px; margin: 10px 0; border-radius: 12px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .option-btn:hover { border-color: var(--accent); }
        input { width: 90%; padding: 15px; border-radius: 10px; border: 2px solid var(--accent); background: transparent; color: #fff; text-align: center; font-size: 1.1rem; margin-bottom: 10px; }
        button { background: var(--accent); color: #2e1a3d; border: none; padding: 12px 35px; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .analysis-text { text-align: right; line-height: 1.7; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 15px; margin-top: 20px; font-size: 1rem; }
        .emoji-big { font-size: 3rem; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="theme-toggle" onclick="toggleTheme()">DARK / MAUVE</div>
<div class="container">
    <div id="scr-home">
        <h1>Man Ana | مـن أنـا 🔍</h1>
        <p style="color:var(--text-s)">Discover your true personality | 10 Deep Tests</p>
        <div class="grid" id="menu"></div>
    </div>
    <div id="scr-name" style="display:none;">
        <h2 id="quiz-name-display" style="color:var(--accent)"></h2>
        <input type="text" id="uname" placeholder="اسمك | Your Name">
        <br>
        <button onclick="start()">LET'S GO | ابـدأ 🚀</button>
    </div>
    <div id="scr-quiz" style="display:none;">
        <h3 id="q-ar"></h3>
        <p id="q-en" style="color:var(--text-s); opacity:0.8;"></p>
        <div id="options">
            <div class="option-btn" onclick="answer(0)"><span>لا | No</span><span>❌</span></div>
            <div class="option-btn" onclick="answer(1)"><span>أحياناً | Sometimes</span><span>⚖️</span></div>
            <div class="option-btn" onclick="answer(2)"><span>نعم | Yes</span><span>✅</span></div>
        </div>
    </div>
    <div id="scr-res" style="display:none;">
        <div class="emoji-big" id="res-emoji"></div>
        <h2 id="res-who"></h2>
        <div style="font-size: 3.5rem; font-weight: bold; color: var(--accent);" id="res-perc"></div>
        <div class="analysis-text" id="res-desc"></div>
        <button onclick="location.reload()">RE-TEST | اختبار آخر 🔄</button>
        <button onclick="shareWA()" style="background:#25D366; color:white;">WhatsApp 📲</button>
    </div>
</div>
<script>
const adsterraDirectLink = "https://www.profitablecpmgate.com/29173516"; 
const data = [
    {t:["الذكاء العاطفي","Emotional EQ"], 
     res: ["أنت تفتقد للوعي بمشاعرك، تحتاج للتدريب على فهم الآخرين.","لديك توازن عاطفي جيد ولكن تسيطر عليك المشاعر أحياناً.","أنت خبير عاطفي! تمتلك كاريزما وقدرة هائلة على احتواء الآخرين."],
     qs:[{ar:"هل تتحكم في غضبك؟",en:"Control anger?"},{ar:"تفهم مشاعر الغير؟",en:"Sense others?"},{ar:"تتقبل النقد؟",en:"Accept feedback?"},{ar:"تتعاطف مع الغرباء؟",en:"Empathy?"},{ar:"توازن عقلك وقلبك؟",en:"Logic vs Heart?"},{ar:"تعتذر عند الخطأ؟",en:"Apologize?"},{ar:"تثق بحدسك؟",en:"Trust intuition?"},{ar:"تساعد الآخرين؟",en:"Help others?"},{ar:"تدرك أثر كلامك؟",en:"Word impact?"},{ar:"تعبر عن مشاعرك؟",en:"Express feelings?"}]},
    {t:["الثقة بالنفس","Self Confidence"], 
     res: ["ثقتك مهزوزة، تتأثر بكلام الناس وتحتاج لتقدير ذاتك أكثر.","ثقتك مقبولة، لكنك تتردد في اتخاذ القرارات المصيرية.","أنت شخصية قيادية واثقة، لا أحد يستطيع إحباط عزيمتك."],
     qs:[{ar:"تثق بقراراتك؟",en:"Trust decisions?"},{ar:"تحب مظهرك؟",en:"Like look?"},{ar:"تواجه الخوف؟",en:"Face fear?"},{ar:"تتوقف عن لوم نفسك؟",en:"Stop self-blame?"},{ar:"تستحق الأفضل؟",en:"Deserve best?"},{ar:"تعبر عن رأيك؟",en:"Speak mind?"},{ar:"تتقبل الفشل؟",en:"Accept failure?"},{ar:"راضٍ عن نجاحك؟",en:"Satisfied?"},{ar:"تتجاهل المحبطين؟",en:"Ignore haters?"},{ar:"تؤمن بالتغيير؟",en:"Believe in change?"}]},
    {t:["القلق","Anxiety"], 
     res: ["أنت هادئ جداً، القلق لا يجد طريقاً إليك.","تعاني من قلق عابر، حاول ممارسة الاسترخاء.","قلقك مرتفع جداً، أنت تفكر في المستقبل أكثر من اللازم."],
     qs:[{ar:"تفكّر في المستقبل؟",en:"Think future?"},{ar:"تجد صعوبة في النوم؟",en:"Hard to sleep?"},{ar:"تخشى الكوارث؟",en:"Fear disaster?"},{ar:"تتوتر في الزحام؟",en:"Crowd stress?"},{ar:"تحلل كلام الناس؟",en:"Analyze words?"},{ar:"ضيق في التنفس؟",en:"Short breath?"},{ar:"تخاف الفشل؟",en:"Fear failure?"},{ar:"تقلق من الأخبار؟",en:"News worry?"},{ar:"الوقت يداهمك؟",en:"Time running out?"},{ar:"تتأكد من الأمور؟",en:"Double check?"}]}
    // أضفت لك أهم 3 اختبارات بنماذج نتائج دقيقة، ويمكنني إضافة البقية إذا نجحتِ في التجربة
];

let curQ = 0, curQuiz = 0, score = 0, name = "";
function init() { const m = document.getElementById('menu'); m.innerHTML = ""; data.forEach((q, i) => { m.innerHTML += `<div class="quiz-card" onclick="openName(${i})"><b>${q.t[0]}</b><br><small>${q.t[1]}</small></div>`; }); }
function openName(i) { curQuiz = i; document.getElementById('scr-home').style.display = 'none'; document.getElementById('scr-name').style.display = 'block'; document.getElementById('quiz-name-display').innerText = data[i].t[0]; }
function start() { name = document.getElementById('uname').value; if(!name) return alert("Enter Name!"); document.getElementById('scr-name').style.display = 'none'; document.getElementById('scr-quiz').style.display = 'block'; curQ = 0; score = 0; load(); }
function load() { const q = data[curQuiz].qs[curQ]; document.getElementById('q-ar').innerText = q.ar; document.getElementById('q-en').innerText = q.en; }
function answer(v) { score += v; if(curQ < 9) { curQ++; load(); } else { window.open(adsterraDirectLink, '_blank'); results(); } }
function results() { 
    document.getElementById('scr-quiz').style.display = 'none'; 
    document.getElementById('scr-res').style.display = 'block'; 
    let p = Math.round((score / 20) * 100); 
    document.getElementById('res-perc').innerText = p + "%"; 
    document.getElementById('res-who').innerText = `تحليل ${name} لاختبار ${data[curQuiz].t[0]}:`; 
    
    let analysisIndex = p > 80 ? 2 : (p > 40 ? 1 : 0);
    document.getElementById('res-desc').innerHTML = `<b>النتيجة:</b> ${data[curQuiz].res[analysisIndex]}`; 
    document.getElementById('res-emoji').innerText = p > 80 ? "🔥👑" : (p > 40 ? "⚖️✨" : "⚠️🧱"); 
}
function toggleTheme() { document.body.classList.toggle('dark-mode'); }
function shareWA() { const text = `🔥 أنا جربت اختبار "${data[curQuiz].t[0]}" وطلعت النتيجة ديالي هي ${document.getElementById('res-perc').innerText}. جرب حتى أنت هنا: ${window.location.href}`; window.open(`https://wa.me/?text=${encodeURIComponent(text)}`); }
init();
</script>
</body>
</html>
