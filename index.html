        12: ["أتعلم الأشياء من أول مرة.<span class='en-sub'>I learn things from the first time.</span>", "أنا سريع جداً في الفهم.<span class='en-sub'>I am very fast at understanding.</span>", "أفهم التعليمات بسرعة.<span class='en-sub'>I understand instructions quickly.</span>", "أنجز الاختبارات قبل غيري.<span class='en-sub'>I finish tests before others.</span>", "لدي ردود فعل سريعة.<span class='en-sub'>I have fast reflexes.</span>", "أفهم ما وراء الكلام.<span class='en-sub'>I understand what's behind words.</span>", "أنا ذكي في تصرفاتي.<span class='en-sub'>I am smart in my actions.</span>", "أعرف كيف أتصرف في الأزمات.<span class='en-sub'>I know how to act in crises.</span>", "لدي عقل متفتح جداً.<span class='en-sub'>I have a very open mind.</span>", "أستوعب المعلومات الضخمة.<span class='en-sub'>I absorb huge information.</span>", "أنا بارع في البديهة.<span class='en-sub'>I am gifted in intuition.</span>", "أفهم التلميحات فوراً.<span class='en-sub'>I understand hints immediately.</span>", "لدي قدرة عالية على الاستيعاب.<span class='en-sub'>I have high comprehension capacity.</span>", "أنا شخص يقظ جداً.<span class='en-sub'>I am a very alert person.</span>", "أعرف كيف أحل التعقيدات.<span class='en-sub'>I know how to solve complexities.</span>", "لدي عقل عملي وسريع.<span class='en-sub'>I have a practical and fast mind.</span>", "أفهم المواقف بلمحة.<span class='en-sub'>I understand situations at a glance.</span>", "أنا ذكي في تواصلي.<span class='en-sub'>I am smart in my communication.</span>", "أعرف كيف أختصر الأمور.<span class='en-sub'>I know how to shorten things.</span>", "لدي مهارة حل المشكلات.<span class='en-sub'>I have problem-solving skills.</span>"],
        13: ["أعرف ما أشعر به دائماً.<span class='en-sub'>I know what I feel always.</span>", "أتحكم في مشاعري السلبية.<span class='en-sub'>I control my negative feelings.</span>", "أفهم مشاعر الآخرين.<span class='en-sub'>I understand others' feelings.</span>", "أعرف كيف أهدئ نفسي.<span class='en-sub'>I know how to calm myself.</span>", "أنا شخص متعاطف جداً.<span class='en-sub'>I am a very empathetic person.</span>", "أعرف كيف أبني علاقات دافئة.<span class='en-sub'>I know how to build warm relationships.</span>", "أتحمل المسؤولية كاملة.<span class='en-sub'>I take full responsibility for my feelings.</span>", "أعرف نقاط قوتي العاطفية.<span class='en-sub'>I know my emotional strengths.</span>", "أنا شخص متزن انفعالياً.<span class='en-sub'>I am emotionally balanced.</span>", "أعرف كيف أواسي الحزين.<span class='en-sub'>I know how to comfort the sad.</span>", "لدي ذكاء في التعامل مع الغضب.<span class='en-sub'>I have intelligence in dealing with anger.</span>", "أفهم دوافع الناس العاطفية.<span class='en-sub'>I understand people's emotional motives.</span>", "أنا شخص مستقر عاطفياً.<span class='en-sub'>I am emotionally stable.</span>", "أعرف كيف أعبر عن حبي.<span class='en-sub'>I know how to express my love.</span>", "لدي قدرة على الإقناع العاطفي.<span class='en-sub'>I have emotional persuasion capacity.</span>", "أنا شخص يقدر المشاعر.<span class='en-sub'>I am a person who values feelings.</span>", "أعرف كيف أحل النزاعات العاطفية.<span class='en-sub'>I know how to solve emotional conflicts.</span>", "أنا صبور مع مشاعر الغير.<span class='en-sub'>I am patient with others' feelings.</span>", "لدي وعي عاطفي كبير.<span class='en-sub'>I have a great emotional awareness.</span>", "أعرف كيف أسعد نفسي.<span class='en-sub'>I know how to make myself happy.</span>"],
        14: ["أنا منسجم مع أحاسيسي.<span class='en-sub'>I am in tune with my senses.</span>", "أعرف كيف أدير انفعالاتي.<span class='en-sub'>I know how to manage my emotions.</span>", "أفهم لغة المشاعر العميقة.<span class='en-sub'>I understand the language of deep feelings.</span>", "أنا شخص حساس وذكي.<span class='en-sub'>I am a sensitive and smart person.</span>", "أعرف كيف أتواصل بقلبي.<span class='en-sub'>I know how to communicate with my heart.</span>", "أنا متصالح مع ضعفي.<span class='en-sub'>I am at peace with my weakness.</span>", "أفهم تقلبات المزاج.<span class='en-sub'>I understand mood swings.</span>", "أنا شخص يحترم العاطفة.<span class='en-sub'>I am a person who respects emotion.</span>", "أعرف كيف أبني جسور الثقة.<span class='en-sub'>I know how to build bridges of trust.</span>", "أنا ذكي في فهم القلوب.<span class='en-sub'>I am smart in understanding hearts.</span>", "أعرف متى أتحدث ومتى أصمت.<span class='en-sub'>I know when to speak and when to be silent.</span>", "أنا شخص يقدر الصدق العاطفي.<span class='en-sub'>I am a person who values emotional honesty.</span>", "أعرف كيف أحمي قلبي.<span class='en-sub'>I know how to protect my heart.</span>", "أنا منفتح على مشاعر العالم.<span class='en-sub'>I am open to the world's feelings.</span>", "لدي قدرة على الاحتواء.<span class='en-sub'>I have a capacity for containment.</span>", "أنا شخص محب وعطوف.<span class='en-sub'>I am a loving and kind person.</span>", "أعرف كيف أدير خيبات الأمل.<span class='en-sub'>I know how to manage disappointments.</span>", "أنا ذكي في بناء الألفة.<span class='en-sub'>I am smart in building intimacy.</span>", "أفهم ما يحتاجه الآخر نفسياً.<span class='en-sub'>I understand what the other needs psychologically.</span>", "أنا شخص متوازن وجدانياً.<span class='en-sub'>I am emotionally balanced.</span>"],
        15: ["أشعر بالقلق أحياناً.<span class='en-sub'>I feel anxious sometimes.</span>"]
    };

    // بقية أكواد المنطق الخاص بالاختبار (startQuiz, next, prev, showResult...)
    const quizTitles = ["تحليل الشخصية الشامل (Big Five)", "اختبار نوع الشخصية (MBTI)", "تحليل الأنماط التسعة (Enneagram)", "مستوى تقدير الذات والتطوير", "تحليل السلوك والمهارات", "التوجيه المهني والوظيفة", "التفكير المنطقي والنقدي", "الذكاء الاجتماعي والذكاء العاطفي", "مستوى الثقة بالنفس", "اختبار التفكير الإيجابي", "اختبار الذكاء العام (General IQ)", "اختبار الذكاء البصري والمكاني", "اختبار سرعة البديهة والذكاء", "الذكاء العاطفي المتقدم", "تحليل القوة الوجدانية", "مستوى التوتر والقلق"];
    let currentQuiz = 0, currentQ = 0, answers = [], userAnswers = [];

    const menu = document.getElementById('menu');
    quizTitles.forEach((t, i) => {
        let card = document.createElement('div');
        card.className = 'quiz-card';
        card.innerHTML = `<span>${t}</span> <span>➔</span>`;
        card.onclick = () => selectQuiz(i);
        menu.appendChild(card);
    });

    function selectQuiz(i) {
        currentQuiz = i;
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('input-screen').style.display = 'block';
        document.getElementById('chosen-title').innerText = quizTitles[i];
    }

    function startQuiz() {
        if (!document.getElementById('username').value) return alert("الرجاء كتابة الاسم!");
        document.getElementById('input-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'block';
        currentQ = 0;
        userAnswers = new Array(20).fill(null);
        showQuestion();
    }

    function showQuestion() {
        document.getElementById('q-text').innerHTML = questionsBank[currentQuiz][currentQ];
        document.getElementById('q-num').innerText = currentQ + 1;
        let opts = document.getElementsByName('opt');
        opts.forEach(o => {
            o.checked = (userAnswers[currentQ] == o.value);
        });
        document.getElementById('prev-btn').style.visibility = currentQ === 0 ? 'hidden' : 'visible';
        document.getElementById('next-btn').innerText = currentQ === 19 ? "إنهاء | Finish" : "التالي | Next";
    }

    function next() {
        let selected = document.querySelector('input[name="opt"]:checked');
        if (!selected) return alert("الرجاء اختيار إجابة!");
        userAnswers[currentQ] = selected.value;
        if (currentQ < 19) {
            currentQ++;
            showQuestion();
        } else {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('pre-result').style.display = 'block';
            document.getElementById('res-btn').innerText = `عرض نتيجة ${document.getElementById('username').value}`;
        }
    }

    function prev() {
        if (currentQ > 0) {
            currentQ--;
            showQuestion();
        }
    }

    function showResult() {
        document.getElementById('pre-result').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        let total = userAnswers.reduce((a, b) => parseInt(a) + parseInt(b), 0);
        let percent = Math.round((total / 40) * 100);
        document.getElementById('score-text').innerText = percent + "%";
        
        let desc = "";
        if (percent > 80) desc = "مذهل! أنت تمتلك صفات استثنائية في هذا الجانب. شخصيتك قوية وواعية جداً.";
        else if (percent > 50) desc = "جيد جداً! لديك توازن ممتاز وقدرات جيدة تحتاج فقط لبعض التطوير البسيط.";
        else desc = "تحتاج للعمل على تطوير نفسك في هذا الجانب. لا تقلق، الاعتراف بالبداية هو أول خطوات النجاح.";
        
        document.getElementById('result-desc').innerHTML = `<strong>${document.getElementById('username').value}</strong>، نتيجتك هي <strong>${percent}%</strong>. <br>${desc}`;
    }

    function shareOnWhatsApp() {
        let text = `اختبرت نفسي في "${quizTitles[currentQuiz]}" وحصلت على ${document.getElementById('score-text').innerText}! جرب الاختبار أنت أيضاً: ${window.location.href}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }
</script>
